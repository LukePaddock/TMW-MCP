# fail2ban jail for the TMW MCP server.
# Install as /etc/fail2ban/jail.d/tmw-mcp.conf, then: systemctl reload fail2ban
#
# logpath must point at the HOST side of the bind mount declared in
# compose.yml, not the path inside the container.

[tmw-mcp]
enabled  = true
filter   = tmw-mcp
logpath  = /opt/tmw-mcp/logs/auth.log
maxretry = 5
findtime = 10m
bantime  = 1h

# IMPORTANT when Nginx Proxy Manager runs in Docker.
#
# Docker DNATs published ports in the nat PREROUTING chain, so that traffic
# traverses FORWARD and never hits INPUT - where fail2ban's default iptables
# actions insert their rules. A ban would appear to apply and do nothing.
# DOCKER-USER is consulted before Docker's own forwarding rules and is the
# supported place for operator rules, so target it explicitly.
#
# If NPM runs directly on the host rather than in a container, drop the
# chain= override and the stock action works.
action = iptables-allports[name=tmw-mcp, chain=DOCKER-USER]

# Never lock yourself out. Add your office egress and management ranges.
ignoreip = 127.0.0.1/8 ::1 10.0.0.0/8 192.168.0.0/16 172.16.0.0/12
