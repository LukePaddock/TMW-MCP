# fail2ban filter for the TMW MCP server auth log.
# Install as /etc/fail2ban/filter.d/tmw-mcp.conf
#
# Matches lines written by tmw_mcp.auth, e.g.
#   2026-10-05 13:49:31 WARNING authentication failed from 203.0.113.45 reason=no_key path=/mcp
#
# The IP is logged by the application, which resolves it from X-Real-IP /
# X-Forwarded-For ONLY when the request came from a host listed in
# TMW_MCP_TRUSTED_PROXIES. Without that set the proxy's own address is logged
# and fail2ban would ban the proxy, so configure it before enabling this jail.

[Definition]

datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S

# <ADDR> rather than <HOST>: the application always logs a literal IP, never a
# hostname, and <ADDR> matches both IPv4 and IPv6. Verify on your box with:
#   fail2ban-regex /opt/tmw-mcp/logs/auth.log /etc/fail2ban/filter.d/tmw-mcp.conf
failregex = ^ WARNING authentication failed from <ADDR> reason=\S+ path=\S*$

ignoreregex =
